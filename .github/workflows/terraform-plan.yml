# Ejecución manual; no hay acceso a nube desde PR ni push.
name: Terraform Plan

on:
  workflow_dispatch:

permissions:
  contents: read

# Plan y apply comparten exclusión mutua sobre el mismo estado de staging.
concurrency:
  group: terraform-staging-operation
  cancel-in-progress: false

jobs:
  validacion:
    if: vars.TERRAFORM_PLAN == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/terraform.yml

  plan:
    name: terraform plan (staging)
    needs: validacion
    if: vars.TERRAFORM_PLAN == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      TF_VERSION: "1.16.2"
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_LOG: "OFF"
      TF_VAR_aws_account_id: ${{ secrets.TF_VAR_AWS_ACCOUNT_ID }}
      TF_VAR_atlas_project_id: ${{ secrets.TF_VAR_ATLAS_PROJECT_ID }}
      TF_VAR_atlas_cluster_name: ${{ secrets.TF_VAR_ATLAS_CLUSTER_NAME }}
      MONGODB_ATLAS_PUBLIC_API_KEY: ${{ secrets.MONGODB_ATLAS_PUBLIC_API_KEY }}
      MONGODB_ATLAS_PRIVATE_API_KEY: ${{ secrets.MONGODB_ATLAS_PRIVATE_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Comprobar configuración sin publicar valores
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          TF_BACKEND_HCL: ${{ secrets.TF_BACKEND_HCL }}
        run: |
          for key in AWS_ROLE_ARN TF_BACKEND_HCL TF_VAR_aws_account_id TF_VAR_atlas_project_id TF_VAR_atlas_cluster_name MONGODB_ATLAS_PUBLIC_API_KEY MONGODB_ATLAS_PRIVATE_API_KEY; do
            if [ -z "${!key}" ]; then
              echo "Falta configuración requerida: $key"
              exit 1
            fi
          done
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - name: Ejecutar plan sin publicar valores sensibles
        working-directory: environments/staging
        env:
          TF_BACKEND_HCL: ${{ secrets.TF_BACKEND_HCL }}
        run: bash "$GITHUB_WORKSPACE/scripts/terraform_operation.sh" plan
