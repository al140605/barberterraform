# Pipeline de Terraform (HT-16: T043 a T046).
#   T044  formato (fmt) y validación (validate) en cada cambio, más tflint y checkov (T030).
#   T045  terraform plan de staging, con un resumen de qué recursos cambian, para revisarlo antes de aplicar.
#   T046  terraform apply SOLO a mano (Run workflow) desde main y detrás de un entorno con aprobación.
#   T043  las credenciales de AWS y de Atlas viven en secretos del repositorio, nunca en el código.
#
# El repositorio es público: los registros del workflow también. Por eso el plan no se imprime; el resumen solo
# lista la dirección y la acción de cada recurso (sin atributos) y el archivo del plan no se sube como artefacto.
# Qué secretos, variables y entorno hay que crear: README.md, sección «Pipeline».
name: Terraform

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "**.tf"
      - "**.hcl"
      - "**.tftest.hcl"
      - ".checkov.yaml"
      - ".github/workflows/terraform.yml"
  push:
    branches: [ "main" ]
    paths:
      - "**.tf"
      - "**.hcl"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      aplicar:
        description: "Aplicar el plan de staging (pide aprobación en el entorno staging-aprobacion)"
        type: boolean
        default: false

# Un solo plan o apply a la vez: el estado remoto se bloquea y dos corridas se estorbarían.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_VERSION: "1.16.2"
  TF_IN_AUTOMATION: "true"

jobs:
  formato:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff

  validar:
    name: terraform validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [ bootstrap/state, environments/staging, environments/ephemeral ]
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # -backend=false: validar no necesita el estado remoto ni credenciales.
      - name: terraform init y validate
        working-directory: ${{ matrix.dir }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Pruebas de Terraform (guarda del ambiente efímero)
        if: matrix.dir == 'environments/ephemeral'
        working-directory: ${{ matrix.dir }}
        run: terraform test

  analisis:
    name: tflint y checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@v4

      # GITHUB_TOKEN evita el límite de peticiones anónimas al bajar el plugin de AWS.
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
          for dir in bootstrap/state environments/staging environments/ephemeral; do
            echo "::group::tflint $dir"
            tflint --chdir="$dir" --config="$GITHUB_WORKSPACE/.tflint.hcl" --minimum-failure-severity=error
            echo "::endgroup::"
          done

      - name: checkov
        run: |
          python3 -m pip install --quiet "checkov>=3,<4"
          checkov --config-file .checkov.yaml

  plan:
    name: terraform plan (staging)
    needs: [ formato, validar, analisis ]
    # Solo corre si el repositorio tiene configurados los secretos (variable TERRAFORM_PLAN = true) y no en forks,
    # donde GitHub no entrega secretos.
    if: >-
      vars.TERRAFORM_PLAN == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_aws_account_id: ${{ secrets.TF_VAR_AWS_ACCOUNT_ID }}
      TF_VAR_atlas_project_id: ${{ secrets.TF_VAR_ATLAS_PROJECT_ID }}
      TF_VAR_atlas_cluster_name: ${{ secrets.TF_VAR_ATLAS_CLUSTER_NAME }}
      MONGODB_ATLAS_PUBLIC_API_KEY: ${{ secrets.MONGODB_ATLAS_PUBLIC_API_KEY }}
      MONGODB_ATLAS_PRIVATE_API_KEY: ${{ secrets.MONGODB_ATLAS_PRIVATE_API_KEY }}
    defaults:
      run:
        working-directory: environments/staging
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Credenciales temporales por OIDC: no se guarda ninguna llave de AWS de larga duración.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: terraform init
        env:
          TF_BACKEND_HCL: ${{ secrets.TF_BACKEND_HCL }}
        run: |
          printf '%s\n' "$TF_BACKEND_HCL" > "$RUNNER_TEMP/backend.hcl"
          terraform init -input=false -backend-config="$RUNNER_TEMP/backend.hcl" > /dev/null

      # La salida completa del plan no se imprime (repositorio público). Con -detailed-exitcode, 0 = sin cambios,
      # 2 = hay cambios (ambos son correctos) y 1 = error: solo entonces se muestran los títulos de los errores.
      - name: terraform plan
        run: |
          code=0
          terraform plan -input=false -no-color -detailed-exitcode -out=staging.tfplan > plan.log 2>&1 || code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "terraform plan falló. Títulos de error:"
            grep -E '^(Error|│ Error):' plan.log || true
            exit 1
          fi

      - name: Resumen del plan
        run: |
          {
            echo "### terraform plan · staging"
            echo
            terraform show -json staging.tfplan | jq -r '
              [.resource_changes[] | select(.change.actions != ["no-op"])] as $c
              | if ($c | length) == 0 then "Sin cambios: la infraestructura coincide con el código."
                else "| Recurso | Acción |\n|---|---|\n" + ($c | map("| `\(.address)` | \(.change.actions | join(", ")) |") | join("\n"))
                end'
          } >> "$GITHUB_STEP_SUMMARY"

  aplicar:
    name: terraform apply (staging)
    needs: plan
    # Solo a mano, desde main y con la casilla «aplicar». El entorno staging-aprobacion exige que una persona
    # revisora lo apruebe (Settings > Environments) antes de que el job arranque.
    if: github.event_name == 'workflow_dispatch' && inputs.aplicar && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging-aprobacion
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_aws_account_id: ${{ secrets.TF_VAR_AWS_ACCOUNT_ID }}
      TF_VAR_atlas_project_id: ${{ secrets.TF_VAR_ATLAS_PROJECT_ID }}
      TF_VAR_atlas_cluster_name: ${{ secrets.TF_VAR_ATLAS_CLUSTER_NAME }}
      MONGODB_ATLAS_PUBLIC_API_KEY: ${{ secrets.MONGODB_ATLAS_PUBLIC_API_KEY }}
      MONGODB_ATLAS_PRIVATE_API_KEY: ${{ secrets.MONGODB_ATLAS_PRIVATE_API_KEY }}
    defaults:
      run:
        working-directory: environments/staging
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: terraform init
        env:
          TF_BACKEND_HCL: ${{ secrets.TF_BACKEND_HCL }}
        run: |
          printf '%s\n' "$TF_BACKEND_HCL" > "$RUNNER_TEMP/backend.hcl"
          terraform init -input=false -backend-config="$RUNNER_TEMP/backend.hcl" > /dev/null

      # Se vuelve a planear justo antes de aplicar y se aplica exactamente ese plan guardado.
      - name: terraform plan y apply
        run: |
          terraform plan -input=false -no-color -out=staging.tfplan > plan.log 2>&1 || { grep -E '^(Error|│ Error):' plan.log || true; exit 1; }
          terraform apply -input=false -no-color staging.tfplan > apply.log 2>&1 || { grep -E '^(Error|│ Error):' apply.log || true; exit 1; }
          grep -E '^Apply complete!' apply.log >> "$GITHUB_STEP_SUMMARY"
