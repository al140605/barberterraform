# Validación sin secretos; también reutilizable por los flujos manuales.
name: Terraform Validacion

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: terraform-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.16.2"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_EC2_METADATA_DISABLED: "true"

jobs:
  pruebas-resumen:
    name: Pruebas del resumen de plan (sin nube)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Dependencias de pruebas de política
        run: python3 -m pip install --quiet -r .github/requirements-tests.txt
      - name: Regresiones de importaciones, acciones y datos sensibles
        run: python3 -B -m unittest discover -s tests -v

  formato:
    name: terraform fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff

  validar:
    name: terraform validate (${{ matrix.dir }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dir: [ bootstrap/state, environments/staging, environments/ephemeral ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # -backend=false: validar no necesita el estado remoto ni credenciales.
      - name: terraform init y validate
        working-directory: ${{ matrix.dir }}
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate

      - name: Pruebas de Terraform (guarda del ambiente efímero)
        if: matrix.dir == 'environments/ephemeral'
        working-directory: ${{ matrix.dir }}
        run: terraform test

  analisis:
    name: tflint y checkov
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: "0.65.0"

      # GITHUB_TOKEN evita el límite de peticiones anónimas al bajar el plugin de AWS.
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
          for dir in bootstrap/state environments/staging environments/ephemeral; do
            echo "::group::tflint $dir"
            tflint --chdir="$dir" --config="$GITHUB_WORKSPACE/.tflint.hcl" --minimum-failure-severity=error
            echo "::endgroup::"
          done

      - name: checkov
        run: |
          python3 -m pip install --quiet -r .github/requirements-security.txt
          checkov --config-file .checkov.yaml
